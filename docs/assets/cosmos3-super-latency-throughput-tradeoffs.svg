<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Cosmos 3 Super Latency-Throughput Tradeoffs</title>
  <desc id="desc">Two measured frontiers for the same four Cosmos 3 Super serving topologies. On B200, valid node throughput ranges from 413.6 to 589.4 video-seconds per node-hour as mean request latency ranges from 68.5 to 378.1 seconds. On H200, valid node throughput ranges from 229.9 to 289.1 as latency ranges from 123.3 to 779.0 seconds. Both platforms show the same topology ordering, with a wider node-throughput range on B200.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #102a43; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #486581; font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .axis { stroke: #829ab1; stroke-width: 2; }
    .grid { stroke: #d9e2ec; stroke-width: 1.5; }
    .tick { fill: #627d98; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .axislabel { fill: #243b53; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .plabel { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .slabel { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #486581; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>

  <rect class="bg" width="1600" height="960"/>
  <text class="title" x="40" y="52">Cosmos 3 Super Latency-Throughput Tradeoffs</text>
  <text class="subtitle" x="40" y="84">Topologies with more replicas measured higher node throughput and latency, with a wider range on B200.</text>

  <line class="grid" x1="180" y1="790" x2="1450" y2="790"/><text class="tick" x="160" y="796" text-anchor="end">200</text>
  <line class="grid" x1="180" y1="625" x2="1450" y2="625"/><text class="tick" x="160" y="631" text-anchor="end">300</text>
  <line class="grid" x1="180" y1="460" x2="1450" y2="460"/><text class="tick" x="160" y="466" text-anchor="end">400</text>
  <line class="grid" x1="180" y1="295" x2="1450" y2="295"/><text class="tick" x="160" y="301" text-anchor="end">500</text>
  <line class="grid" x1="180" y1="130" x2="1450" y2="130"/><text class="tick" x="160" y="136" text-anchor="end">600</text>

  <line class="grid" x1="180" y1="130" x2="180" y2="790"/><text class="tick" x="180" y="820" text-anchor="middle">0</text>
  <line class="grid" x1="339" y1="130" x2="339" y2="790"/><text class="tick" x="339" y="820" text-anchor="middle">100</text>
  <line class="grid" x1="498" y1="130" x2="498" y2="790"/><text class="tick" x="498" y="820" text-anchor="middle">200</text>
  <line class="grid" x1="656" y1="130" x2="656" y2="790"/><text class="tick" x="656" y="820" text-anchor="middle">300</text>
  <line class="grid" x1="815" y1="130" x2="815" y2="790"/><text class="tick" x="815" y="820" text-anchor="middle">400</text>
  <line class="grid" x1="974" y1="130" x2="974" y2="790"/><text class="tick" x="974" y="820" text-anchor="middle">500</text>
  <line class="grid" x1="1132" y1="130" x2="1132" y2="790"/><text class="tick" x="1132" y="820" text-anchor="middle">600</text>
  <line class="grid" x1="1291" y1="130" x2="1291" y2="790"/><text class="tick" x="1291" y="820" text-anchor="middle">700</text>
  <line class="grid" x1="1450" y1="130" x2="1450" y2="790"/><text class="tick" x="1450" y="820" text-anchor="middle">800</text>

  <line class="axis" x1="180" y1="790" x2="1450" y2="790"/>
  <line class="axis" x1="180" y1="130" x2="180" y2="790"/>
  <text class="axislabel" x="815" y="866" text-anchor="middle">Mean request latency (seconds)</text>
  <text class="axislabel" x="52" y="460" text-anchor="middle" transform="rotate(-90 52 460)">Node throughput (valid video-seconds per node-hour)</text>

  <polyline fill="none" stroke="#2864dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="289,438 373,351 517,247 780,147"/>
  <circle cx="289" cy="438" r="12" fill="#2864dc" stroke="#16324f" stroke-width="6"/>
  <text class="plabel" fill="#16324f" x="289" y="408" text-anchor="middle">1 × 8</text>
  <text class="plabel" fill="#627d98" x="289" y="428" text-anchor="middle">413.6</text>
  <circle cx="373" cy="351" r="12" fill="#ffffff" stroke="#16324f" stroke-width="6"/>
  <text class="plabel" fill="#16324f" x="373" y="321" text-anchor="middle">2 × 4</text>
  <text class="plabel" fill="#627d98" x="373" y="341" text-anchor="middle">466.3</text>
  <circle cx="517" cy="247" r="12" fill="#ffffff" stroke="#16324f" stroke-width="6"/>
  <text class="plabel" fill="#16324f" x="517" y="217" text-anchor="middle">4 × 2</text>
  <text class="plabel" fill="#627d98" x="517" y="237" text-anchor="middle">529.0</text>
  <circle cx="780" cy="147" r="12" fill="#2864dc" stroke="#16324f" stroke-width="6"/>
  <text class="plabel" fill="#16324f" x="780" y="117" text-anchor="middle">8 × 1</text>
  <text class="plabel" fill="#627d98" x="780" y="137" text-anchor="middle">589.4</text>
  <text class="slabel" fill="#16324f" x="750" y="192" text-anchor="end">B200</text>
  <polyline fill="none" stroke="#b44d12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="376,741 545,715 841,672 1417,643"/>
  <circle cx="376" cy="741" r="12" fill="#b44d12" stroke="#7a3208" stroke-width="6"/>
  <text class="plabel" fill="#7a3208" x="376" y="711" text-anchor="middle">1 × 8</text>
  <text class="plabel" fill="#627d98" x="376" y="731" text-anchor="middle">229.9</text>
  <circle cx="545" cy="715" r="12" fill="#ffffff" stroke="#7a3208" stroke-width="6"/>
  <text class="plabel" fill="#7a3208" x="545" y="685" text-anchor="middle">2 × 4</text>
  <text class="plabel" fill="#627d98" x="545" y="705" text-anchor="middle">245.6</text>
  <circle cx="841" cy="672" r="12" fill="#ffffff" stroke="#7a3208" stroke-width="6"/>
  <text class="plabel" fill="#7a3208" x="841" y="642" text-anchor="middle">4 × 2</text>
  <text class="plabel" fill="#627d98" x="841" y="662" text-anchor="middle">271.4</text>
  <circle cx="1417" cy="643" r="12" fill="#b44d12" stroke="#7a3208" stroke-width="6"/>
  <text class="plabel" fill="#7a3208" x="1417" y="613" text-anchor="middle">8 × 1</text>
  <text class="plabel" fill="#627d98" x="1417" y="633" text-anchor="middle">289.1</text>
  <text class="slabel" fill="#7a3208" x="1387" y="688" text-anchor="end">H200</text>

  <text class="note" x="180" y="924">Nebius measurement of NVIDIA Cosmos 3 Super, one eight-GPU node per platform, one software stack. Lines connect observed topologies for readability.</text>
</svg>
